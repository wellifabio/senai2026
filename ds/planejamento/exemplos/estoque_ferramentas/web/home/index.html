<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Controle de Estoque</title>
</head>

<body>
    <header>
        <h1>Controle de Estoque</h1>
        <nav>
            <h2>Usuário</h2>
            <button onclick="sair()">Sair</button>
            <button onclick="modalAdicionarProduto.classList.remove('oculto')">Adicionar Produto</button>
            <button onclick="window.location.href='../estoque/'">Gestão do Estoque</button>
        </nav>
    </header>
    <main>
        <div class="filtro-container">
            <h2>Lista de Produtos</h2>
            <div>
                <label for="filtro">Filtrar</label>
                <input type="text" id="filtro" oninput="filtrarProdutos()">
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Imagem</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Dimensões</th>
                    <th>Peso Kg</th>
                    <th>Quantidade</th>
                    <th>Estoque mínimo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Produtos serão inseridos aqui dinamicamente -->
            </tbody>
        </table>
    </main>
    <div id="modalAdicionarProduto" class="modal oculto">
        <div class="janela">
            <h2>Adicionar Produto</h2>
            <form>
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" required>
                </div>
                <div>
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" required></textarea>
                </div>
                <div>
                    <label for="dimensoes">Dimensões:</label>
                    <input type="text" id="dimensoes" name="dimensoes" required>
                </div>
                <div>
                    <label for="peso">Peso (Kg):</label>
                    <input type="number" step="0.01" id="peso" name="peso" required>
                </div>
                <div>
                    <label for="estoqueMinimo">Estoque Mínimo:</label>
                    <input type="number" id="estoqueMinimo" name="estoqueMinimo" required>
                </div>
                <div>
                    <label for="imagem">Imagem URL:</label>
                    <input type="text" id="imagem" name="imagem">
                </div>
                <div style="display: flex; justify-content: space-around; flex-direction: row;">
                    <button type="reset" onclick="modalAdicionarProduto.classList.add('oculto')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <div id="modalAlterarProduto" class="modal oculto">
        <div class="janela">
            <h2>Alterar Produto</h2>
            <img id="img" src="" alt="Ilustração do produto"
                style="width: 200px; height: 200px; object-fit: cover; margin-bottom: 10px; align-self: center;">
            <form>
                <input type="hidden" name="id" required>
                <div>
                    <label for="nomeu">Nome:</label>
                    <input type="text" id="nomeu" name="nome" required>
                </div>
                <div>
                    <label for="descricaou">Descrição:</label>
                    <textarea id="descricaou" name="descricao" required></textarea>
                </div>
                <div>
                    <label for="dimensoesu">Dimensões:</label>
                    <input type="text" id="dimensoesu" name="dimensoes" required>
                </div>
                <div>
                    <label for="pesou">Peso (Kg):</label>
                    <input type="number" step="0.01" id="pesou" name="peso" required>
                </div>
                <div>
                    <label for="estoqueu">Quantidad em estoque:</label>
                    <input type="number" id="estoqueu" name="estoque" required>
                </div>
                <div>
                    <label for="estoqueMinimou">Estoque Mínimo:</label>
                    <input type="number" id="estoqueMinimou" name="estoqueMinimo" required>
                </div>
                <div>
                    <label for="imagemu">Imagem URL:</label>
                    <input type="text" id="imagemu" name="imagem">
                </div>
                <div style="display: flex; justify-content: space-around; flex-direction: row;">
                    <button type="reset" onclick="modalAlterarProduto.classList.add('oculto')">Cancelar</button>
                    <button type="submit">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
